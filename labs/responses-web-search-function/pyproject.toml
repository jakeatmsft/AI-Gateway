[project]
name = "responses-web-search-function"
version = "0.1.0"
description = "Entra-only Responses web search, APIM buffering, and Azure Function streaming"
requires-python = ">=3.12"
dependencies = [
  "azure-functions>=1.21,<2",
  "azurefunctions-extensions-http-fastapi>=1.0,<2",
  "azure-identity>=1.19,<2",
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "python-dotenv",
  "ipykernel",
  "nbformat",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
